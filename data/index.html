<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Термометр</title>
    <script src="chart.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: #1a1a1a;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        /* Верхняя строка */
        .mode-bar {
            padding: 12px 20px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #333;
            transition: background-color 0.3s;
        }
        .mode0 { background: #0066cc; }      /* синий */
        .mode1-green { background: #00aa00; } /* зелёный */
        .mode1-yellow { background: #cccc00; color: #000; } /* жёлтый */
        .mode1-red { background: #cc0000; }   /* красный */
        
        /* Основной ряд: левая колонка + график */
        .main-row {
            display: flex;
            min-height: 500px;
        }
        /* Левая колонка - УЖАТАЯ */
        .left-panel {
            width: 90px;
            background: #222;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border-right: 2px solid #333;
        }
        /* Карточки с цифрами */
        .temp-card {
            width: 80px;
            height: 50px;
            background: #2a2a2a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        /* ============================================ */
        /* КНОПКИ МАСШТАБА (синяя активная) */
        /* ============================================ */
        .scale-btn {
            width: 80px;
            height: 36px;
            background: #333;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 1px 0;
            transition: background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .scale-btn:hover {
            background: #3a3a3a;
        }
        .scale-btn:active {
            background: #4a4a4a;
        }
        .scale-btn.active {
            background: #0066cc !important;
        }
        .scale-btn.active:active {
            background: #0066cc !important;
        }
        
        /* Нижний блок левой панели (от/до и ONLINE) */
        .panel-bottom {
            margin-top: 8px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #444;
            padding-top: 8px;
        }
        .panel-range-item {
            width: 80px;
            background: #2a2a2a;
            border-radius: 4px;
            padding: 4px 0;
            text-align: center;
        }
        .panel-range-item label {
            color: #aaa;
            font-size: 11px;
            display: block;
        }
        .panel-range-item input {
            width: 70px;
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 4px;
            border-radius: 3px;
            font-size: 14px;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
            step: 0.1;
        }
        .panel-range-item input::-webkit-outer-spin-button,
        .panel-range-item input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .panel-status {
            width: 80px;
            background: #2a2a2a;
            border-radius: 4px;
            padding: 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .panel-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        /* Пульсация */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .panel-status-dot.online {
            background: #4CAF50;
            box-shadow: 0 0 6px #4CAF50;
            animation: none;
        }
        .panel-status-text.online {
            color: #4CAF50;
            animation: none;
        }
        .panel-status-dot.offline-yellow {
            background: #ffaa00;
            box-shadow: 0 0 6px #ffaa00;
            animation: pulse 1.5s infinite;
        }
        .panel-status-text.offline-yellow {
            color: #ffaa00;
            animation: pulse 1.5s infinite;
        }
        .panel-status-dot.offline {
            background: #f44336;
            box-shadow: 0 0 6px #f44336;
            animation: pulse 1.5s infinite;
        }
        .panel-status-text.offline {
            color: #f44336;
            animation: pulse 1.5s infinite;
        }
        .panel-status-text {
            font-size: 12px;
            font-weight: bold;
        }
        
        /* Правая часть — график */
        .chart-area {
            flex: 1;
            padding: 20px 20px 20px 20px;
            background: #1a1a1a;
            position: relative;
        }
        #tempChart {
            width: 100%;
            height: 100%;
            min-height: 450px;
        }
        
        /* ============================================ */
        /* ОТЛАДОЧНАЯ СТРОКА ПОД ГРАФИКОМ */
        /* ============================================ */
        .debug-bar {
            background: #222;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .debug-bar span {
            white-space: nowrap;
        }
        .debug-value {
            color: #ffaa00;
            font-weight: bold;
        }
        
        /* Нижняя строка с диапазоном и статусом (скрыта) */
        .bottom-bar {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Верхняя строка с режимом и временем -->
    <div class="mode-bar mode0" id="modeDisplay">
        MODE 1 (СТАБИЛИЗАЦИЯ) 00:00
    </div>

    <!-- Основной ряд: левая колонка + график -->
    <div class="main-row">
        <!-- Левая колонка -->
        <div class="left-panel">
            <!-- Карточки температур -->
            <div class="temp-card" id="card3" style="color: #FFA500;">--.--</div> <!-- 100см -->
            <div class="temp-card" id="card2" style="color: #00FFFF;">--.--</div> <!-- 75см -->
            <div class="temp-card" id="card1" style="color: #FFFF00;">--.--</div> <!-- 50см -->
            <div class="temp-card" id="card0" style="color: #00FF00;">--.--</div> <!-- гильза -->
            
            <!-- КНОПКИ МАСШТАБА (5 ШТУК) -->
            <button class="scale-btn" id="btn1h" data-range="1ч">1ч</button>
            <button class="scale-btn" id="btn30m" data-range="30м">30м</button>
            <button class="scale-btn" id="btn15m" data-range="15м">15м</button>
            <button class="scale-btn" id="btn5m" data-range="5м">5м</button>
            <button class="scale-btn active" id="btn1m" data-range="1м">1м</button>
            
            <!-- Нижний блок (от/до и ONLINE) -->
            <div class="panel-bottom">
                <div class="panel-range-item">
                    <label>от</label>
                    <input type="number" id="minTemp" value="20.0" step="0.1" min="-50.0" max="150.0">
                </div>
                <div class="panel-range-item">
                    <label>до</label>
                    <input type="number" id="maxTemp" value="90.0" step="0.1" min="-50.0" max="150.0">
                </div>
                <div class="panel-status" id="panelStatus">
                    <span class="panel-status-dot offline" id="panelStatusDot"></span>
                    <span class="panel-status-text offline" id="panelStatusText">OFF</span>
                </div>
            </div>
        </div>

        <!-- График -->
        <div class="chart-area">
            <canvas id="tempChart"></canvas>
        </div>
    </div>  <!-- конец main-row -->

    <!-- ОТЛАДОЧНАЯ СТРОКА ПОД ГРАФИКОМ -->
    <div class="debug-bar" id="debugBar">
        <span>Буфер: <span class="debug-value" id="debugBuffer">0/7200</span></span>
        <span>Диапазон: <span class="debug-value" id="debugRange">120</span></span>
        <span>Активна: <span class="debug-value" id="debugActive">1м</span></span>
        <span>Точка: <span class="debug-value" id="debugLastTime">--:--:--</span></span>
    </div>
</div>

<script>
    // ============================================
    // 1. КОНФИГУРАЦИЯ (оптимизировано)
    // ============================================
    const CONFIG = {
        MAX_POINTS: 7200,
        WS_URL: 'ws://' + window.location.hostname + ':8080',
        CHART_UPDATE_INTERVAL: 500,
        RANGES: {
            '1ч': 7200,
            '30м': 3600,
            '15м': 1800,
            '5м': 600,
            '1м': 120
        },
        RECONNECT: {
            MAX_ATTEMPTS: 5,
            DELAYS: [1, 2, 4, 8, 15, 30, 30, 30, 30, 30],
            MAX_DELAY: 30
        }
    };

    // ============================================
    // 2. СОСТОЯНИЕ (оптимизировано)
    // ============================================
    const state = {
        // WebSocket
        socket: null,
        reconnectAttempts: 0,
        reconnectTimeout: null,
        
        // Данные
        dataBuffer: {
            time: new Array(CONFIG.MAX_POINTS).fill(''),
            guild: new Array(CONFIG.MAX_POINTS).fill(null),
            wall50: new Array(CONFIG.MAX_POINTS).fill(null),
            wall75: new Array(CONFIG.MAX_POINTS).fill(null),
            wall100: new Array(CONFIG.MAX_POINTS).fill(null),
            index: 0,
            count: 0,
            lastTime: ''
        },
        
        // Последние значения
        lastValues: {
            mode: -1,
            color: -1,
            time: '',
            baseTemp: null,
            temps: [null, null, null, null]
        },
        
        // UI
        currentRange: 120,
        chartUpdateTimer: null,
        pendingChartUpdate: false,
        chart: null
    };

    // ============================================
    // 3. ЗВУКИ (сгруппированы)
    // ============================================
    const soundManager = {
        tormazi: new Audio('/tormazi.wav'),
        zhdati: new Audio('/zhdati.wav'),
        interval: null,
        yellowCycleState: false,
        
        play(sound) {
            if (!sound) return;
            sound.currentTime = 0;
            sound.play().catch(e => console.log('[ЗВУК] Ошибка воспроизведения', e));
        },
        
        stopAll() {
            if (this.interval) {
                clearInterval(this.interval);
                this.interval = null;
            }
            this.yellowCycleState = false;
            console.log('[ЗВУК] Все циклы остановлены');
        },
        
        startYellowCycle() {
            this.stopAll();
            console.log('[ЗВУК] Запуск жёлтого цикла');
            this.yellowCycleState = false;
            
            this.interval = setInterval(() => {
                this.play(this.yellowCycleState ? this.tormazi : this.zhdati);
                console.log(`[ЗВУК] Жёлтый цикл: ${this.yellowCycleState ? 'tormazi' : 'zhdati'}`);
                this.yellowCycleState = !this.yellowCycleState;
            }, 60000);
        },
        
        startRedCycle() {
            this.stopAll();
            console.log('[ЗВУК] Запуск красного цикла');
            
            this.interval = setInterval(() => {
                this.play(this.tormazi);
                console.log('[ЗВУК] Красный цикл: tormazi');
            }, 30000);
        }
    };

    // ============================================
    // 4. УТИЛИТЫ ДЛЯ РАБОТЫ С DOM
    // ============================================
    const dom = {
        get: (id) => document.getElementById(id),
        
        updateStatus(status, attempts = 0) {
            const dot = this.get('panelStatusDot');
            const text = this.get('panelStatusText');
            
            if (status === 'online') {
                dot.className = 'panel-status-dot online';
                text.className = 'panel-status-text online';
                text.textContent = 'ON';
                state.reconnectAttempts = 0;
            } 
            else if (status === 'offline') {
                const isYellow = attempts <= CONFIG.RECONNECT.MAX_ATTEMPTS;
                dot.className = `panel-status-dot ${isYellow ? 'offline-yellow' : 'offline'}`;
                text.className = `panel-status-text ${isYellow ? 'offline-yellow' : 'offline'}`;
                text.textContent = 'OFF';
            }
        },
        
        updateCard(cardId, value, index) {
            const card = this.get(cardId);
            if (!card) return;
            
            const formatted = value.toFixed(2);
            if (card.textContent !== formatted) {
                card.textContent = formatted;
            }
            state.lastValues.temps[index] = value;
        },
        
        updateDebugInfo() {
            this.get('debugBuffer').textContent = `${state.dataBuffer.count}/${CONFIG.MAX_POINTS}`;
            this.get('debugRange').textContent = state.currentRange;
            
            const buttonName = Object.keys(CONFIG.RANGES).find(
                key => CONFIG.RANGES[key] === state.currentRange
            ) || '?';
            this.get('debugActive').textContent = buttonName;
            this.get('debugLastTime').textContent = state.dataBuffer.lastTime || '--:--:--';
        }
    };

    // ============================================
    // 5. ГРАФИК
    // ============================================
    function initChart() {
        const ctx = dom.get('tempChart').getContext('2d');
        state.chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Гильза', data: [], borderColor: '#00FF00', tension: 0.1, pointRadius: 0 },
                    { label: '50см', data: [], borderColor: '#FFFF00', tension: 0.1, pointRadius: 0 },
                    { label: '75см', data: [], borderColor: '#00FFFF', tension: 0.1, pointRadius: 0 },
                    { label: '100см', data: [], borderColor: '#FFA500', tension: 0.1, pointRadius: 0 },
                    { 
                        label: 'База', 
                        data: [], 
                        borderColor: '#FF0000', 
                        backgroundColor: '#FF0000',
                        tension: 0,
                        pointRadius: 2,
                        pointStyle: 'circle',
                        showLine: false,
                        order: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 100 },
                scales: {
                    y: { 
                        title: { display: false },
                        min: 20,
                        max: 90,
                        grid: { color: '#333' },
                        ticks: { 
                            color: '#ccc',
                            stepSize: 0.5,
                            callback: v => v.toFixed(1)
                        }
                    },
                    x: { 
                        ticks: { color: '#ccc', maxTicksLimit: 8 }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function scheduleChartUpdate() {
        if (state.pendingChartUpdate) return;
        state.pendingChartUpdate = true;
        
        if (state.chartUpdateTimer) {
            clearTimeout(state.chartUpdateTimer);
        }
        
        state.chartUpdateTimer = setTimeout(() => {
            performChartUpdate();
            state.pendingChartUpdate = false;
            state.chartUpdateTimer = null;
        }, CONFIG.CHART_UPDATE_INTERVAL);
    }
    
    function performChartUpdate() {
        const start = Math.max(0, state.dataBuffer.count - state.currentRange);
        const end = state.dataBuffer.count;
        
        const labels = [];
        const datasets = [[], [], [], [], []];
        const baseTemp = state.lastValues.baseTemp;
        
        for (let i = start; i < end; i++) {
            const idx = (state.dataBuffer.index - state.dataBuffer.count + i + CONFIG.MAX_POINTS) % CONFIG.MAX_POINTS;
            labels.push(state.dataBuffer.time[idx]);
            datasets[0].push(state.dataBuffer.guild[idx]);
            datasets[1].push(state.dataBuffer.wall50[idx]);
            datasets[2].push(state.dataBuffer.wall75[idx]);
            datasets[3].push(state.dataBuffer.wall100[idx]);
            datasets[4].push(state.lastValues.mode === 1 && baseTemp !== null ? baseTemp : null);
        }
        
        state.chart.data.labels = labels;
        state.chart.data.datasets.forEach((dataset, i) => {
            dataset.data = datasets[i];
        });
        state.chart.update();
        
        dom.updateDebugInfo();
    }

    // ============================================
    // 6. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
    // ============================================
    function updateModeDisplay(mode, color, timeStr, baseTemp) {
        const modeDisplay = dom.get('modeDisplay');
        if (!modeDisplay) return;
        
        const last = state.lastValues;
        if (last.mode === mode && last.color === color && 
            last.time === timeStr && last.baseTemp === baseTemp) {
            return;
        }
        
        // Звуки при смене цвета
        if (color !== last.color) {
            console.log(`[ЗВУК] Смена цвета: ${last.color} -> ${color}`);
            
            if (color === 1 || color === 2) {
                soundManager.play(soundManager.tormazi);
            }
            
            if (color === 1) {
                soundManager.startYellowCycle();
            } 
            else if (color === 2) {
                soundManager.startRedCycle();
            } 
            else if (color === 0) {
                soundManager.stopAll();
            }
        }
        
        // Обновление текста
        let newText, newClass;
        if (mode === 0) {
            newClass = 'mode-bar mode0';
            newText = 'MODE 1 (СТАБИЛИЗАЦИЯ) ' + timeStr;
        } else {
            const colorClass = color === 1 ? 'mode1-yellow' : (color === 2 ? 'mode1-red' : 'mode1-green');
            newClass = `mode-bar ${colorClass}`;
            const baseStr = baseTemp !== null ? baseTemp.toFixed(2) : '--.--';
            newText = `MODE 2 (РАБОЧИЙ ${baseStr}) ${timeStr}`;
        }
        
        modeDisplay.className = newClass;
        modeDisplay.textContent = newText;
        
        Object.assign(last, { mode, color, time: timeStr, baseTemp });
    }

    function processData(data) {
        dom.updateCard('card0', data.guild, 0);
        dom.updateCard('card1', data.wall50, 1);
        dom.updateCard('card2', data.wall75, 2);
        dom.updateCard('card3', data.wall100, 3);
        
        updateModeDisplay(data.mode, data.color, data.time || '00:00', data.baseTemp);
        
        const now = new Date();
        const timeLabel = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        
        state.dataBuffer.lastTime = timeLabel;
        const idx = state.dataBuffer.index;
        
        state.dataBuffer.time[idx] = timeLabel;
        state.dataBuffer.guild[idx] = data.guild;
        state.dataBuffer.wall50[idx] = data.wall50;
        state.dataBuffer.wall75[idx] = data.wall75;
        state.dataBuffer.wall100[idx] = data.wall100;
        
        state.dataBuffer.index = (idx + 1) % CONFIG.MAX_POINTS;
        if (state.dataBuffer.count < CONFIG.MAX_POINTS) {
            state.dataBuffer.count++;
        }
        
        scheduleChartUpdate();
    }

    // ============================================
    // 7. WEBSOCKET (с новым индикатором)
    // ============================================
    function scheduleReconnect() {
        state.reconnectAttempts++;
        
        dom.updateStatus('offline', state.reconnectAttempts);
        
        const delays = CONFIG.RECONNECT.DELAYS;
        const baseDelay = delays[Math.min(state.reconnectAttempts - 1, delays.length - 1)];
        const jitter = (Math.random() * 4) - 2;
        const delayMs = Math.max(1000, (baseDelay + jitter) * 1000);
        
        console.log(`[WS] Попытка ${state.reconnectAttempts}, через ${Math.round(delayMs/1000)}с`);
        
        if (state.reconnectTimeout) {
            clearTimeout(state.reconnectTimeout);
        }
        
        state.reconnectTimeout = setTimeout(() => {
            connectWebSocket();
        }, delayMs);
    }

    function connectWebSocket() {
        dom.updateStatus('offline', state.reconnectAttempts + 1);
        
        if (state.socket && state.socket.readyState !== WebSocket.CLOSED) {
            state.socket.close();
        }
        
        state.socket = new WebSocket(CONFIG.WS_URL);
        
        state.socket.onopen = function() {
            console.log('[WS] Соединение установлено');
            dom.updateStatus('online');
            state.reconnectAttempts = 0;
            
            if (state.reconnectTimeout) {
                clearTimeout(state.reconnectTimeout);
                state.reconnectTimeout = null;
            }
        };
        
        state.socket.onclose = function() {
            console.log('[WS] Соединение закрыто');
            scheduleReconnect();
        };
        
        state.socket.onmessage = function(event) {
            try {
                processData(JSON.parse(event.data));
            } catch (e) {
                console.error('[WS] Ошибка парсинга:', e);
            }
        };
        
        state.socket.onerror = function(error) {
            console.error('[WS] Ошибка:', error);
        };
    }

    // ============================================
    // 8. УПРАВЛЕНИЕ МАСШТАБОМ (универсальный обработчик)
    // ============================================
    function setupControls() {
        // Универсальный обработчик для кнопок масштаба
        document.querySelectorAll('.scale-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const range = this.dataset.range;
                if (range && CONFIG.RANGES[range]) {
                    console.log(`[КНОПКА] Нажата ${range}`);
                    state.currentRange = CONFIG.RANGES[range];
                    
                    // Обновляем активную кнопку
                    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    performChartUpdate();
                }
            });
        });
        
        // Поля ввода с debounce
        let minTimeout, maxTimeout;
        
        dom.get('minTemp').addEventListener('input', function() {
            clearTimeout(minTimeout);
            minTimeout = setTimeout(() => {
                const val = parseFloat(this.value);
                if (!isNaN(val)) {
                    state.chart.options.scales.y.min = val;
                    state.chart.update();
                }
            }, 300);
        });
        
        dom.get('maxTemp').addEventListener('input', function() {
            clearTimeout(maxTimeout);
            maxTimeout = setTimeout(() => {
                const val = parseFloat(this.value);
                if (!isNaN(val)) {
                    state.chart.options.scales.y.max = val;
                    state.chart.update();
                }
            }, 300);
        });
    }

    // ============================================
    // 9. ЗАПУСК
    // ============================================
    window.onload = function() {
        initChart();
        setupControls();
        connectWebSocket();
        dom.updateDebugInfo();
        
        document.addEventListener('touchstart', () => {
            console.log('[ЗВУК] Аудиоконтекст инициализирован');
        }, { once: true });
    };
</script>
</body>
</html>
