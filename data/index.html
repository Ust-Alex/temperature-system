<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Термометр</title>
    
    <!-- Chart.js -->
    <script src="chart.umd.min.js"></script>
    <!-- Hammer.js для распознавания жестов -->
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <!-- Плагин зума для Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхнее окно (режим) -->
    <div class="window window-header" id="windowHeader">
        <div class="mode-bar mode0" id="modeDisplay">
            MODE 1 (СТАБИЛИЗАЦИЯ) 00:00
        </div>
    </div>

    <!-- Левое окно (панель управления) -->
    <div class="window window-left" id="windowLeft">
        <div class="left-panel">
            <!-- ================================================================
                 6 КАРТОЧЕК ТЕМПЕРАТУР (НОВЫЙ ПОРЯДОК)
                 ================================================================ -->
            <div class="temp-card" id="card0" style="color: #FF00FF;">--.--</div>   <!-- 0: ВЫХОД -->
            <div class="temp-card" id="card1" style="color: #FFA500;">--.--</div>   <!-- 1: СТЕНКА 100см -->
            <div class="temp-card" id="card2" style="color: #00FFFF;">--.--</div>   <!-- 2: СТЕНКА 75см -->
            <div class="temp-card" id="card3" style="color: #FFFF00;">--.--</div>   <!-- 3: СТЕНКА 50см -->
            <div class="temp-card" id="card4" style="color: #00FF00;">--.--</div>   <!-- 4: ГИЛЬЗА -->
            <div class="temp-card" id="card5" style="color: #FF4500;">--.--</div>   <!-- 5: КУБ -->
            
            <!-- Кнопки масштаба -->
            <button class="scale-btn" id="btn1h" data-range="1ч">1ч</button>
            <button class="scale-btn" id="btn30m" data-range="30м">30м</button>
            <button class="scale-btn" id="btn15m" data-range="15м">15м</button>
            <button class="scale-btn" id="btn5m" data-range="5м">5м</button>
            <button class="scale-btn active" id="btn1m" data-range="1м">1м</button>
            
            <!-- Нижний блок -->
            <div class="panel-bottom">
                <div class="panel-range-item">
                    <label>до</label>
                    <input type="number" id="maxTemp" value="90.0" step="0.1" min="-50.0" max="150.0">
                </div>
                <div class="panel-range-item">
                    <label>от</label>
                    <input type="number" id="minTemp" value="20.0" step="0.1" min="-50.0" max="150.0">
                </div>
                <div class="panel-status" id="panelStatus">
                    <span class="panel-status-dot offline" id="panelStatusDot"></span>
                    <span class="panel-status-text offline" id="panelStatusText">OFF</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Окно графика -->
    <div class="window window-graph" id="windowGraph">
        <canvas id="tempChart"></canvas>
    </div>

    <!-- Нижнее окно (отладка) -->
    <div class="window window-debug" id="windowDebug">
        <div class="debug-bar" id="debugBar">
            <span>Буфер: <span class="debug-value" id="debugBuffer">0/7200</span></span>
            <span>Диапазон: <span class="debug-value" id="debugRange">120</span></span>
            <span>Активна: <span class="debug-value" id="debugActive">1м</span></span>
            <span>Точка: <span class="debug-value" id="debugLastTime">--:--:--</span></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
