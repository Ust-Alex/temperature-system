<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Термометр</title>
    <script src="chart.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: #1a1a1a;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        /* Верхняя строка */
        .mode-bar {
            padding: 12px 20px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #333;
            transition: background-color 0.3s;
        }
        .mode0 { background: #0066cc; }      /* синий */
        .mode1-green { background: #00aa00; } /* зелёный */
        .mode1-yellow { background: #cccc00; color: #000; } /* жёлтый */
        .mode1-red { background: #cc0000; }   /* красный */
        
        /* Основной ряд: левая колонка + график */
        .main-row {
            display: flex;
            min-height: 500px;
        }
        /* Левая колонка - УЖАТАЯ */
        .left-panel {
            width: 90px;
            background: #222;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border-right: 2px solid #333;
        }
        /* Карточки с цифрами */
        .temp-card {
            width: 80px;
            height: 50px;
            background: #2a2a2a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        /* ============================================ */
        /* КНОПКИ МАСШТАБА (синяя активная) */
        /* ============================================ */
        .scale-btn {
            width: 80px;
            height: 36px;
            background: #333;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 1px 0;
            transition: background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .scale-btn:hover {
            background: #3a3a3a;
        }
        .scale-btn:active {
            background: #4a4a4a;
        }
        .scale-btn.active {
            background: #0066cc !important;
        }
        .scale-btn.active:active {
            background: #0066cc !important;
        }
        
        /* Нижний блок левой панели (от/до и ONLINE) */
        .panel-bottom {
            margin-top: 8px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #444;
            padding-top: 8px;
        }
        .panel-range-item {
            width: 80px;
            background: #2a2a2a;
            border-radius: 4px;
            padding: 4px 0;
            text-align: center;
        }
        .panel-range-item label {
            color: #aaa;
            font-size: 11px;
            display: block;
        }
        .panel-range-item input {
            width: 70px;
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 4px;
            border-radius: 3px;
            font-size: 14px;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
            step: 0.1;
        }
        .panel-range-item input::-webkit-outer-spin-button,
        .panel-range-item input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .panel-status {
            width: 80px;
            background: #2a2a2a;
            border-radius: 4px;
            padding: 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .panel-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .panel-status-dot.online {
            background: #4CAF50;
            box-shadow: 0 0 6px #4CAF50;
        }
        .panel-status-dot.offline {
            background: #f44336;
            box-shadow: 0 0 6px #f44336;
        }
        .panel-status-text {
            font-size: 12px;
            font-weight: bold;
        }
        .panel-status-text.online {
            color: #4CAF50;
        }
        .panel-status-text.offline {
            color: #f44336;
        }
        
        /* Правая часть — график */
        .chart-area {
            flex: 1;
            padding: 20px 20px 20px 20px;
            background: #1a1a1a;
            position: relative;
        }
        #tempChart {
            width: 100%;
            height: 100%;
            min-height: 450px;
        }
        
        /* ============================================ */
        /* ОТЛАДОЧНАЯ СТРОКА ПОД ГРАФИКОМ */
        /* ============================================ */
        .debug-bar {
            background: #222;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .debug-bar span {
            white-space: nowrap;
        }
        .debug-value {
            color: #ffaa00;
            font-weight: bold;
        }
        
        /* Нижняя строка с диапазоном и статусом (скрыта) */
        .bottom-bar {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Верхняя строка с режимом и временем -->
    <div class="mode-bar mode0" id="modeDisplay">
        MODE 1 (СТАБИЛИЗАЦИЯ) 00:00
    </div>

    <!-- Основной ряд: левая колонка + график -->
    <div class="main-row">
        <!-- Левая колонка -->
        <div class="left-panel">
            <!-- Карточки температур -->
            <div class="temp-card" id="card3" style="color: #FFA500;">--.--</div> <!-- 100см -->
            <div class="temp-card" id="card2" style="color: #00FFFF;">--.--</div> <!-- 75см -->
            <div class="temp-card" id="card1" style="color: #FFFF00;">--.--</div> <!-- 50см -->
            <div class="temp-card" id="card0" style="color: #00FF00;">--.--</div> <!-- гильза -->
            
            <!-- КНОПКИ МАСШТАБА (ТЕПЕРЬ 5 ШТУК) -->
            <button class="scale-btn active" id="btn1h">1ч</button>
            <button class="scale-btn" id="btn30m">30м</button>
            <button class="scale-btn" id="btn15m">15м</button>
            <button class="scale-btn" id="btn5m">5м</button>
            <button class="scale-btn" id="btn1m">1м</button>  <!-- НОВАЯ КНОПКА -->
            
            <!-- Нижний блок (от/до и ONLINE) -->
            <div class="panel-bottom">
                <div class="panel-range-item">
                    <label>от</label>
                    <input type="number" id="minTemp" value="20.0" step="0.1" min="-50.0" max="150.0">
                </div>
                <div class="panel-range-item">
                    <label>до</label>
                    <input type="number" id="maxTemp" value="90.0" step="0.1" min="-50.0" max="150.0">
                </div>
                <div class="panel-status" id="panelStatus">
                    <span class="panel-status-dot offline" id="panelStatusDot"></span>
                    <span class="panel-status-text offline" id="panelStatusText">OFF</span>
                </div>
            </div>
        </div>

        <!-- График -->
        <div class="chart-area">
            <canvas id="tempChart"></canvas>
        </div>
    </div>  <!-- конец main-row -->

    <!-- ОТЛАДОЧНАЯ СТРОКА ПОД ГРАФИКОМ -->
    <div class="debug-bar" id="debugBar">
        <span>Буфер: <span class="debug-value" id="debugBuffer">0/7200</span></span>
        <span>Диапазон: <span class="debug-value" id="debugRange">7200</span></span>
        <span>Активна: <span class="debug-value" id="debugActive">1ч</span></span>
        <span>Точка: <span class="debug-value" id="debugLastTime">--:--:--</span></span>
    </div>
</div>

<script>
    // ============================================
    // 1. НАСТРОЙКИ
    // ============================================
    const MAX_POINTS = 7200;
    const WS_URL = 'ws://192.168.4.1:8080';
    const CHART_UPDATE_INTERVAL = 500;
    
    // СООТВЕТСТВИЕ КНОПОК И КОЛИЧЕСТВА ТОЧЕК (с новой 1м)
    const RANGE_MAP = {
        '1ч': 7200,
        '30м': 3600,
        '15м': 1800,
        '5м': 600,
        '1м': 120
    };
    
    // ОБРАТНОЕ СООТВЕТСТВИЕ ДЛЯ ОТЛАДКИ
    const RANGE_TO_BUTTON = {
        7200: '1ч',
        3600: '30м',
        1800: '15м',
        600: '5м',
        120: '1м'
    };
    
    // WebSocket
    let socket;
    let reconnectTimer;
    
    // График
    let chart;
    let currentRange = 7200; // по умолчанию 1ч
    
    // ============================================
    // 2. КОЛЬЦЕВОЙ БУФЕР
    // ============================================
    const dataBuffer = {
        time: new Array(MAX_POINTS).fill(''),
        guild: new Array(MAX_POINTS).fill(null),
        wall50: new Array(MAX_POINTS).fill(null),
        wall75: new Array(MAX_POINTS).fill(null),
        wall100: new Array(MAX_POINTS).fill(null),
        index: 0,
        count: 0,
        maxPoints: MAX_POINTS,
        lastTime: ''
    };
    
    // ============================================
    // 3. КЭШ ПРЕДЫДУЩИХ ЗНАЧЕНИЙ
    // ============================================
    const lastValues = {
        mode: -1,
        color: -1,
        time: '',
        baseTemp: null,
        temps: [null, null, null, null]
    };
    
    // ============================================
    // 4. ТРОТТЛИНГ
    // ============================================
    let chartUpdateTimer = null;
    let pendingChartUpdate = false;
    
    // ============================================
    // 5. ИНИЦИАЛИЗАЦИЯ ГРАФИКА
    // ============================================
    const ctx = document.getElementById('tempChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { 
                    label: 'Гильза', 
                    data: [], 
                    borderColor: '#00FF00', 
                    tension: 0.1, 
                    pointRadius: 0 
                },
                { 
                    label: '50см', 
                    data: [], 
                    borderColor: '#FFFF00', 
                    tension: 0.1, 
                    pointRadius: 0 
                },
                { 
                    label: '75см', 
                    data: [], 
                    borderColor: '#00FFFF', 
                    tension: 0.1, 
                    pointRadius: 0 
                },
                { 
                    label: '100см', 
                    data: [], 
                    borderColor: '#FFA500', 
                    tension: 0.1, 
                    pointRadius: 0 
                },
                { 
                    label: 'База', 
                    data: [], 
                    borderColor: '#FF0000', 
                    backgroundColor: '#FF0000',
                    tension: 0,
                    pointRadius: 2,
                    pointStyle: 'circle',
                    showLine: false,
                    order: 0
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 100 },
            scales: {
                y: { 
                    title: { display: false },
                    min: 20,
                    max: 90,
                    grid: { color: '#333' },
                    ticks: { 
                        color: '#ccc',
                        stepSize: 0.5,
                        callback: function(value) {
                            return value.toFixed(1);
                        }
                    }
                },
                x: { 
                    ticks: { color: '#ccc', maxTicksLimit: 8 }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });

    // ============================================
    // 6. ОБНОВЛЕНИЕ ОТЛАДОЧНОЙ СТРОКИ
    // ============================================
    function updateDebugInfo() {
        document.getElementById('debugBuffer').textContent = `${dataBuffer.count}/${MAX_POINTS}`;
        document.getElementById('debugRange').textContent = currentRange;
        
        const buttonName = RANGE_TO_BUTTON[currentRange] || '?';
        document.getElementById('debugActive').textContent = buttonName;
        
        document.getElementById('debugLastTime').textContent = dataBuffer.lastTime || '--:--:--';
    }

    // ============================================
    // 7. ОБНОВЛЕНИЕ ГРАФИКА
    // ============================================
    function scheduleChartUpdate() {
        if (pendingChartUpdate) return;
        pendingChartUpdate = true;
        
        if (chartUpdateTimer) {
            clearTimeout(chartUpdateTimer);
        }
        
        chartUpdateTimer = setTimeout(() => {
            performChartUpdate();
            pendingChartUpdate = false;
            chartUpdateTimer = null;
        }, CHART_UPDATE_INTERVAL);
    }
    
    function performChartUpdate() {
        const start = Math.max(0, dataBuffer.count - currentRange);
        const end = dataBuffer.count;
        
        console.log(`[ГРАФИК] Обновление: диапазон=${currentRange}, точек в буфере=${dataBuffer.count}, показываем=${end-start}`);
        
        const labels = [];
        const guild = [];
        const wall50 = [];
        const wall75 = [];
        const wall100 = [];
        const baseLine = [];
        
        const baseTemp = lastValues.baseTemp;
        
        for (let i = start; i < end; i++) {
            const idx = (dataBuffer.index - dataBuffer.count + i + dataBuffer.maxPoints) % dataBuffer.maxPoints;
            labels.push(dataBuffer.time[idx]);
            guild.push(dataBuffer.guild[idx]);
            wall50.push(dataBuffer.wall50[idx]);
            wall75.push(dataBuffer.wall75[idx]);
            wall100.push(dataBuffer.wall100[idx]);
            
            if (lastValues.mode === 1 && baseTemp !== null) {
                baseLine.push(baseTemp);
            } else {
                baseLine.push(null);
            }
        }
        
        chart.data.labels = labels;
        chart.data.datasets[0].data = guild;
        chart.data.datasets[1].data = wall50;
        chart.data.datasets[2].data = wall75;
        chart.data.datasets[3].data = wall100;
        chart.data.datasets[4].data = baseLine;
        chart.update();
        
        updateDebugInfo();
    }

    // ============================================
    // 8. ОБНОВЛЕНИЕ КАРТОЧЕК
    // ============================================
    function updateCardIfChanged(cardId, newValue, index) {
        const card = document.getElementById(cardId);
        if (!card) return;
        
        const formatted = newValue.toFixed(2);
        
        if (card.textContent !== formatted) {
            card.textContent = formatted;
        }
        
        lastValues.temps[index] = newValue;
    }

    // ============================================
    // 9. ОБНОВЛЕНИЕ ВЕРХНЕЙ ПЛАШКИ
    // ============================================
    function updateModeDisplay(mode, color, timeStr, baseTemp) {
        const modeDisplay = document.getElementById('modeDisplay');
        if (!modeDisplay) return;
        
        if (lastValues.mode === mode && 
            lastValues.color === color && 
            lastValues.time === timeStr &&
            lastValues.baseTemp === baseTemp) {
            return;
        }
        
        let newText = '';
        let newClass = '';
        
        if (mode === 0) {
            newClass = 'mode-bar mode0';
            newText = 'MODE 1 (СТАБИЛИЗАЦИЯ) ' + timeStr;
        } else {
            let colorClass = 'mode1-green';
            if (color === 1) { 
                colorClass = 'mode1-yellow'; 
            } else if (color === 2) { 
                colorClass = 'mode1-red'; 
            }
            newClass = `mode-bar ${colorClass}`;
            
            const baseStr = (baseTemp !== null && baseTemp !== undefined) 
                ? baseTemp.toFixed(2) 
                : '--.--';
            newText = `MODE 2 (РАБОЧИЙ ${baseStr}) ${timeStr}`;
        }
        
        modeDisplay.className = newClass;
        modeDisplay.textContent = newText;
        
        lastValues.mode = mode;
        lastValues.color = color;
        lastValues.time = timeStr;
        lastValues.baseTemp = baseTemp;
    }

    // ============================================
    // 10. СТАТУС
    // ============================================
    function setPanelStatus(online) {
        const dot = document.getElementById('panelStatusDot');
        const text = document.getElementById('panelStatusText');
        
        if (online) {
            dot.className = 'panel-status-dot online';
            text.className = 'panel-status-text online';
            text.textContent = 'ON';
        } else {
            dot.className = 'panel-status-dot offline';
            text.className = 'panel-status-text offline';
            text.textContent = 'OFF';
        }
    }

    // ============================================
    // 11. ОБРАБОТКА ДАННЫХ
    // ============================================
    function processData(data) {
        updateCardIfChanged('card0', data.guild, 0);
        updateCardIfChanged('card1', data.wall50, 1);
        updateCardIfChanged('card2', data.wall75, 2);
        updateCardIfChanged('card3', data.wall100, 3);
        
        updateModeDisplay(data.mode, data.color, data.time || '00:00', data.baseTemp);
        
        const now = new Date();
        const timeLabel = now.getHours().toString().padStart(2,'0') + ':' + 
                         now.getMinutes().toString().padStart(2,'0') + ':' + 
                         now.getSeconds().toString().padStart(2,'0');
        
        dataBuffer.lastTime = timeLabel;
        
        dataBuffer.time[dataBuffer.index] = timeLabel;
        dataBuffer.guild[dataBuffer.index] = data.guild;
        dataBuffer.wall50[dataBuffer.index] = data.wall50;
        dataBuffer.wall75[dataBuffer.index] = data.wall75;
        dataBuffer.wall100[dataBuffer.index] = data.wall100;
        
        dataBuffer.index = (dataBuffer.index + 1) % dataBuffer.maxPoints;
        if (dataBuffer.count < dataBuffer.maxPoints) {
            dataBuffer.count++;
        }
        
        scheduleChartUpdate();
        updateDebugInfo();
    }

    // ============================================
    // 12. WEBSOCKET
    // ============================================
    function connectWebSocket() {
        setPanelStatus(false);
        
        socket = new WebSocket(WS_URL);
        
        socket.onopen = function() {
            setPanelStatus(true);
            if (reconnectTimer) {
                clearInterval(reconnectTimer);
                reconnectTimer = null;
            }
        };
        
        socket.onclose = function() {
            setPanelStatus(false);
            if (!reconnectTimer) {
                reconnectTimer = setInterval(connectWebSocket, 3000);
            }
        };
        
        socket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                processData(data);
            } catch (e) {
                console.error('Ошибка парсинга JSON:', e);
            }
        };
        
        socket.onerror = function(error) {
            console.error('WebSocket ошибка:', error);
        };
    }

    // ============================================
    // 13. УПРАВЛЕНИЕ МАСШТАБОМ (С НОВОЙ КНОПКОЙ)
    // ============================================
    function setupControls() {
        document.getElementById('btn1h').addEventListener('click', function() {
            console.log('[КНОПКА] Нажата 1ч');
            currentRange = RANGE_MAP['1ч'];
            setActiveScaleButton(this);
            performChartUpdate();
        });
        
        document.getElementById('btn30m').addEventListener('click', function() {
            console.log('[КНОПКА] Нажата 30м');
            currentRange = RANGE_MAP['30м'];
            setActiveScaleButton(this);
            performChartUpdate();
        });
        
        document.getElementById('btn15m').addEventListener('click', function() {
            console.log('[КНОПКА] Нажата 15м');
            currentRange = RANGE_MAP['15м'];
            setActiveScaleButton(this);
            performChartUpdate();
        });
        
        document.getElementById('btn5m').addEventListener('click', function() {
            console.log('[КНОПКА] Нажата 5м');
            currentRange = RANGE_MAP['5м'];
            setActiveScaleButton(this);
            performChartUpdate();
        });
        
        // НОВАЯ КНОПКА 1м
        document.getElementById('btn1m').addEventListener('click', function() {
            console.log('[КНОПКА] Нажата 1м');
            currentRange = RANGE_MAP['1м'];
            setActiveScaleButton(this);
            performChartUpdate();
        });
        
        // Поля ввода
        let minTimeout, maxTimeout;
        
        document.getElementById('minTemp').addEventListener('input', function() {
            clearTimeout(minTimeout);
            minTimeout = setTimeout(() => {
                const val = parseFloat(this.value);
                if (!isNaN(val)) {
                    chart.options.scales.y.min = val;
                    chart.update();
                }
            }, 300);
        });
        
        document.getElementById('maxTemp').addEventListener('input', function() {
            clearTimeout(maxTimeout);
            maxTimeout = setTimeout(() => {
                const val = parseFloat(this.value);
                if (!isNaN(val)) {
                    chart.options.scales.y.max = val;
                    chart.update();
                }
            }, 300);
        });
    }

    function setActiveScaleButton(activeBtn) {
        document.querySelectorAll('.scale-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        activeBtn.classList.add('active');
        updateDebugInfo();
    }

    // ============================================
    // 14. ЗАПУСК
    // ============================================
    window.onload = function() {
        setupControls();
        connectWebSocket();
        updateDebugInfo();
    };
</script>
</body>
</html>
